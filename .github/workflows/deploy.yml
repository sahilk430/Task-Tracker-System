# Deploys client and server to Vercel on every push to master.
# Uses the Vercel project owner's token, so commits from any collaborator deploy
# (Vercel's Git integration blocks non-member commit authors on Hobby plans).
name: Deploy to Vercel

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: client
            project_id_secret: VERCEL_PROJECT_ID_CLIENT
          - app: server
            project_id_secret: VERCEL_PROJECT_ID_SERVER
    name: Deploy ${{ matrix.app }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@latest
      # Project settings (incl. Root Directory) and env vars come from Vercel
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
